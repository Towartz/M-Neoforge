name: Build Mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build jar --no-daemon --stacktrace

      - name: Generate Checksums & Metadata
        id: metadata
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
          md5sum *.jar > MD5SUMS.txt
          cat SHA256SUMS.txt
          JAR_NAME=$(ls meteor-client-neoforge-*.jar | head -n 1)
          JAR_SIZE=$(stat -c %s "$JAR_NAME")
          JAR_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $JAR_SIZE/1048576}")
          JAR_SHA256=$(sha256sum "$JAR_NAME" | awk '{print $1}')
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "jar_size_mb=$JAR_SIZE_MB" >> $GITHUB_OUTPUT
          echo "jar_sha256=$JAR_SHA256" >> $GITHUB_OUTPUT

      - name: Write GitHub Step Summary
        run: |
          echo "### 🚀 Meteor Client NeoForge Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target NeoForge** | \`21.1.249\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Minecraft Version** | \`1.21.1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact Name** | \`${{ steps.metadata.outputs.jar_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact Size** | \`${{ steps.metadata.outputs.jar_size_mb }} MB\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA256 Checksum** | \`${{ steps.metadata.outputs.jar_sha256 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meteor-client-neoforge-1.21.1
          path: |
            dist/*.jar
            dist/*.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            dist/*.txt
          generate_release_notes: true
          draft: false
          prerelease: false
